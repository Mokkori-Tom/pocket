name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o pocket-linux-arm64 .
      - run: gh release create "$GITHUB_REF_NAME" pocket-linux-arm64 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
